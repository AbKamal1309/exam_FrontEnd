<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-brand"><span class="brand-icon">⬡</span><h1>ExamPlatform</h1></div>
    <h2 class="auth-title">{{ lang.t('register.title') }}</h2>
    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <div class="form-group">
        <label>{{ lang.t('register.name') }}</label>
        <input type="text" name="name" [(ngModel)]="name" required [placeholder]="lang.t('users.name_ph')" class="form-control" />
      </div>
      <div class="form-group">
        <label>{{ lang.t('login.email') }}</label>
        <input type="email" name="email" [(ngModel)]="email" required [placeholder]="lang.t('users.email_ph')" class="form-control" />
      </div>
      <div class="form-group">
        <label>{{ lang.t('login.password') }}</label>
        <input type="password" name="password" [(ngModel)]="password" required placeholder="••••••••" class="form-control" />
      </div>
      <button type="submit" class="btn-primary" [disabled]="loading">
        <span *ngIf="loading" class="spinner"></span>
        {{ loading ? lang.t('register.loading') : lang.t('register.btn') }}
      </button>
    </form>
    <p class="auth-link">{{ lang.t('register.have_account') }} <a routerLink="/login">{{ lang.t('nav.login') }}</a></p>
  </div>
</div>
